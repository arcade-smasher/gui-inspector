import java.util.zip.ZipFile

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'maven-publish'
}

subprojects {
	apply plugin: 'net.fabricmc.fabric-loom'
	apply plugin: 'maven-publish'

	version = "${project.mod_version}+mc${project.minecraft_version}"
	group = project.maven_group

	base {
		archivesName = project.archives_base_name
	}

	// preprocessor is very messy, should probably use a preexisting one but whatever
	// make SURE you comment non-26.1 code (and ONLY non-26.1) in an //#if block with //$$

	def preprocessedDir = layout.buildDirectory.dir("preprocessed/java")

	def preprocessCommonSources = tasks.register("preprocessCommonSources") {
		def srcDir = rootProject.file('common/src/main/java')
		def outDir = preprocessedDir.get().asFile

		def preprocessVars = { ->
			def autoVars = rootProject.subprojects.collectEntries { sub ->
				def key = sub.name.replaceAll('[^a-zA-Z0-9_]', '_')
				if (key ==~ /^[0-9].*/) key = '_' + key
				[(key): (sub.name == project.name)]
			}
			def userVars = project.hasProperty('preprocessVars') ? project.preprocessVars : [:]
			autoVars + userVars
		}

		inputs.dir(srcDir)
		inputs.property('preprocessVars') { preprocessVars().toString() }
		outputs.dir(outDir)

		doLast {
			def vars = preprocessVars()

			outDir.deleteDir()
			outDir.mkdirs()

			def binding = new Binding()
			vars.each { k, v -> binding.setVariable(k, v) }
			def shell = new GroovyShell(binding)

			fileTree(srcDir).visit { fte ->
				if (fte.directory) return
				def targetFile = new File(outDir, fte.relativePath.pathString)
				targetFile.parentFile.mkdirs()

				def output = new StringBuilder()
				def stack = [true]
				def matchedStack = [true]

				fte.file.eachLine { line ->
					def trimmed = line.trim()
					if (trimmed.startsWith('//#if ')) {
						def expr = trimmed.substring(6).trim()
						boolean result = stack.last() && (shell.evaluate(expr) as boolean)
						stack.push(result)
						matchedStack.push(result)
					} else if (trimmed.startsWith('//#elif ')) {
						def expr = trimmed.substring(8).trim()
						stack.pop()
						boolean parentActive = stack.first()
						boolean alreadyMatched = matchedStack.pop()
						boolean result = parentActive && !alreadyMatched && (shell.evaluate(expr) as boolean)
						stack.push(result)
						matchedStack.push(alreadyMatched || result)
					} else if (trimmed == '//#else') {
						stack.pop()
						boolean parentActive = stack.first()
						boolean alreadyMatched = matchedStack.pop()
						boolean result = parentActive && !alreadyMatched
						stack.push(result)
						matchedStack.push(alreadyMatched || result)
					} else if (trimmed == '//#endif') {
						stack.pop()
						matchedStack.pop()
					} else if (stack.first()) {
						if (trimmed.startsWith('//$$')) {
							def uncommented = line.replaceFirst(/\/\/\$\$/, '')
							output.append(uncommented).append('\n')
						} else {
							output.append(line).append('\n')
						}
					}
				}

				targetFile.text = output.toString()
			}
		}
	}

	sourceSets {
		stub {
			java {
				srcDirs = [rootProject.file('stub/src/main/java')]
			}
		}
		main {
			compileClasspath += sourceSets.stub.output
			java {
				if (project.name == '26.1') {
					srcDir rootProject.file('common/src/main/java')
				} else {
					srcDir preprocessedDir
				}
			}
			resources {
				srcDir rootProject.file('common/src/main/resources')
			}
		}
	}

	tasks.matching { it.name == 'sourcesJar' || it.name == 'compileJava' }.configureEach {
		dependsOn preprocessCommonSources
	}

	afterEvaluate {
		def mcFiles = sourceSets.main.compileClasspath.files - sourceSets.stub.output.files
		sourceSets.stub.compileClasspath += project.files(mcFiles)
	}

	loom {
		accessWidenerPath = rootProject.file("common/src/main/resources/guiinspector.accesswidener")
	}

	repositories {
	}

	dependencies {
		minecraft "com.mojang:minecraft:${project.minecraft_version}"
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

		include implementation("io.github.spair:imgui-java-binding:${project.imgui_version}")
		include implementation("io.github.spair:imgui-java-lwjgl3:${project.imgui_version}") {
			exclude group: 'org.lwjgl'
		}
		include implementation("io.github.spair:imgui-java-natives-windows:${project.imgui_version}")
		include implementation("io.github.spair:imgui-java-natives-linux:${project.imgui_version}")
		include implementation("io.github.spair:imgui-java-natives-macos:${project.imgui_version}")

		compileOnly sourceSets.stub.output

//		stubCompileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
//		stubCompileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	}

	processResources {
		inputs.property "version", project.version
		inputs.property "version_range", project.version_range

		filesMatching("fabric.mod.json") {
			expand (
					"version": inputs.properties.version,
					"version_range": inputs.properties.version_range
			)
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
	}

	java {
		withSourcesJar()
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}

	jar {
		inputs.property "archivesName", project.base.archivesName

		from(rootProject.file("LICENSE")) {
			rename { "${it}_${inputs.properties.archivesName}" }
		}

		exclude { details ->
			sourceSets.stub.output.classesDirs.any { stubDir ->
				details.file.canonicalPath.startsWith(stubDir.canonicalPath)
			}
		}
	}

	publishing {
		publications {
			create("mavenJava", MavenPublication) {
				artifactId = project.base.archivesName.toString()
				from components.java
			}
		}

		repositories {
		}
	}
}